[package]
name = "plotters-dioxus"
version = "1.0.0"
edition = "2021"
license = "MIT"
resolver = "1"
description = "A plotters-rs component for dioxus"
readme = "../README.md"
repository = "https://github.com/DorianPinaud/plotters-dioxus"
keywords = ["dioxus", "plotters-rs", "plot", "chart", "drawing"]
authors = ["Dorian Pinaud dorian.pinaud@gmail.com"]
categories = ["visualization", "gui"]

[features]
default = ["svg","bitmap"]
svg = ["plotters/svg_backend"]
bitmap = ["plotters/bitmap_backend", "dep:image", "dep:base64"]

[dependencies]
dioxus = "^0.7.9"
plotters = { version  = "^0.3.7", default-features = false }
image = { version = "0.25.10", optional = true }
base64 = { version = "0.22.1", optional = true}
